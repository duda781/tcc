<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Explorer</title>
  <link rel="stylesheet" href="style tcc.css">
</head>

<body>

  <!-- ESTRELAS -->
  <div class="estrelas"></div>

  <!-- LOGO -->
  <h1 class="logo">
    SISTEMA SOLAR
    <span>EXPLORAÇÃO</span>
  </h1>

  <!-- MENU LATERAL (SISTEMA SOLAR REVERSO) -->
  <div class="menu-container">

    <!-- Mercúrio -->
    <div class="menu">
      <div class="indicador"></div>
      <div class="miniatura mercurio-miniatura"></div>
      <div class="planeta-info">
        <h2 class="planeta-nome">Mercúrio</h2>
        <span class="planeta-distancia">0.39 AU</span>
      </div>
    </div>

    <!-- Vênus -->
    <div class="menu">
      <div class="indicador"></div>
      <div class="miniatura venus-miniatura"></div>
      <div class="planeta-info">
        <h2 class="planeta-nome">Vênus</h2>
        <span class="planeta-distancia">0.723 AU</span>
      </div>
    </div>

    <!-- Terra -->
    <div class="menu">
      <div class="indicador"></div>
      <div class="miniatura terra-miniatura"></div>
      <div class="planeta-info">
        <h2 class="planeta-nome">Terra</h2>
        <span class="planeta-distancia">1 AU</span>
      </div>
    </div>

    <!-- Marte -->
    <div class="menu">
      <div class="indicador"></div>
      <div class="miniatura marte-miniatura"></div>
      <div class="planeta-info">
        <h2 class="planeta-nome">Marte</h2>
        <span class="planeta-distancia">1.524 AU</span>
      </div>
    </div>

    <!-- Júpiter -->
    <div class="menu">
      <div class="indicador"></div>
      <div class="miniatura jupiter-miniatura"></div>
      <div class="planeta-info">
        <h2 class="planeta-nome">Júpiter</h2>
        <span class="planeta-distancia">5.203 AU</span>
      </div>
    </div>

    <!-- Saturno -->
    <div class="menu">
      <div class="indicador"></div>
      <div class="miniatura saturno-miniatura"></div>
      <div class="planeta-info">
        <h2 class="planeta-nome">Saturno</h2>
        <span class="planeta-distancia">9.539 AU</span>
      </div>
    </div>

    <!-- Urano -->
    <div class="menu">
      <div class="indicador"></div>
      <div class="miniatura urano-miniatura"></div>
      <div class="planeta-info">
        <h2 class="planeta-nome">Urano</h2>
        <span class="planeta-distancia">19.18 AU</span>
      </div>
    </div>

    <!-- Netuno -->
    <div class="menu">
      <div class="indicador"></div>
      <div class="miniatura netuno-miniatura"></div>
      <div class="planeta-info">
        <h2 class="planeta-nome">Netuno</h2>
        <span class="planeta-distancia">30.06 AU</span>
      </div>
    </div>

    <!-- Plutão -->
    <div class="menu">
      <div class="indicador"></div>
      <div class="miniatura plutao-miniatura"></div>
      <div class="planeta-info">
        <h2 class="planeta-nome">Plutão</h2>
        <span class="planeta-distancia">39.5 AU</span>
      </div>
    </div>

  </div>

  <!-- SISTEMA SOLAR (MAPA ORBITAL COMPLETO) -->
  <div class="sistema-solar">

    <!-- SOL -->
    <div class="sol"></div>

    <!-- ÓRBITAS E SEUS PLANETAS -->
    <div class="orbita orbita1">
      <div class="planeta mercurio"></div>
    </div>

    <div class="orbita orbita2">
      <div class="planeta venus"></div>
    </div>

    <div class="orbita orbita3">
      <div class="planeta terra"></div>
    </div>

    <div class="orbita orbita4">
      <div class="planeta marte"></div>
    </div>

    <div class="orbita orbita5">
      <div class="planeta jupiter"></div>
    </div>

    <div class="orbita orbita6">
      <div class="planeta saturno"></div>
    </div>

    <div class="orbita orbita7">
      <div class="planeta urano"></div>
    </div>

    <div class="orbita orbita8">
      <div class="planeta netuno"></div>
    </div>

    <div class="orbita orbita9">
      <div class="planeta plutao"></div>
    </div>

  </div>

  <script src="script tcc.js"></script>

</body>

</html>
